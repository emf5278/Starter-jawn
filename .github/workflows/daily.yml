name: Daily HR predictions

on:
  schedule:
    # GitHub's `schedule` trigger for this repo is unreliable: some mornings
    # it fires 1-3 hours late, some mornings it silently never fires at all.
    # Rather than rely on one cron + a human noticing, we give it five
    # attempts spread across the morning (UTC, no DST: 12:41 = 8:41am ET
    # EDT). The "Decide whether to run" gate step below skips everything
    # expensive (Statcast pull, Odds API call, commit) the moment
    # web/predictions.json already shows today's date, so a day where
    # several of these attempts land costs nothing extra — only the first
    # one to actually fire does real work.
    - cron: "41 12 * * *"
    - cron: "11 13 * * *"
    - cron: "41 13 * * *"
    - cron: "11 14 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:
    inputs:
      lite:
        description: "Skip raw-Statcast pitcher splits (faster)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/mlb-hr-prediction-dashboard-ywd14t"]
    paths: ["web/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # push only redeploys already-committed web/ content
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY=$(TZ=America/New_York date +%F)
            CURRENT=$(python3 -c "import json; print(json.load(open('web/predictions.json')).get('date',''))" 2>/dev/null || echo "")
            if [ "$CURRENT" = "$TODAY" ]; then
              echo "Already have $TODAY committed (an earlier scheduled attempt today succeeded) -- skipping this retry."
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore pybaseball cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -q -r requirements.txt

      - name: Grade yesterday's picks
        if: steps.gate.outputs.run == 'true'
        run: python -m pipeline.grade || echo "grading failed; continuing"

      - name: Run pipeline
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          python -m pipeline.run --output web/predictions.json \
            ${{ inputs.lite && '--lite' || '' }}

      - name: Commit updated predictions
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/predictions.json history results
          git diff --cached --quiet || git commit -m "predictions: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: predict
    if: needs.predict.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Pages must be enabled once by a human (Settings -> Pages -> Source:
    # GitHub Actions). Until then this job fails; don't let that mark the
    # daily prediction run red.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
