name: Daily HR predictions

on:
  schedule:
    # 13:00 UTC = 9am EDT (8am EST — GitHub cron has no timezone support;
    # bump to 14:00 in winter if the extra hour matters to you).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      lite:
        description: "Skip raw-Statcast pitcher splits (faster)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/mlb-hr-prediction-dashboard-ywd14t"]
    paths: ["web/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore pybaseball cache
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-

      - name: Run pipeline
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          python -m pip install -q -r requirements.txt
          python -m pipeline.run --output web/predictions.json \
            ${{ inputs.lite && '--lite' || '' }}

      - name: Commit updated predictions
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/predictions.json
          git diff --cached --quiet || git commit -m "predictions: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    # Pages must be enabled once by a human (Settings -> Pages -> Source:
    # GitHub Actions). Until then this job fails; don't let that mark the
    # daily prediction run red.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
