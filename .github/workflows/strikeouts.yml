name: Pitcher strikeout board

# Refreshes every morning on its own cron (separate from the HR board's --
# each pipeline makes its own single Odds API call, so this doesn't double
# up on the HR board's usage). Projects games with first pitch at/after 5pm
# ET and does NOT touch the home-run predictions.
on:
  schedule:
    # Same top-of-hour-avoidance reasoning as the HR board's cron: 12:47 UTC
    # = 8:47am ET (EDT), offset a few minutes from the HR board's 8:41 run
    # so the two don't queue at the exact same moment.
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      all_day:
        description: "Include games before 5pm ET too"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strikeout-board
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pybaseball cache
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Grade yesterday's strikeout picks
        run: python -m pipeline.grade_strikeouts || echo "grading failed; continuing"

      - name: Project strikeouts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          python -m pipeline.run_strikeouts --output web/strikeouts.json \
            ${{ inputs.all_day && '--all-day' || '' }}

      - name: Commit strikeout board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/strikeouts.json history/strikeouts results/strikeout_log.csv results/strikeouts
          git diff --cached --quiet || git commit -m "strikeouts: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: project
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
