name: Pitcher strikeout board

# Refreshes every morning on its own cron (separate from the HR board's --
# each pipeline makes its own single Odds API call, so this doesn't double
# up on the HR board's usage). Projects games with first pitch at/after 5pm
# ET and does NOT touch the home-run predictions.
on:
  schedule:
    # GitHub's `schedule` trigger is unreliable for this repo (late by
    # hours, or dropped outright some mornings), so this gets five attempts
    # spread across the morning instead of one, each offset a few minutes
    # from the HR board's crons so the two don't queue at the same moment.
    # The "Decide whether to run" gate step skips all the expensive work
    # (Statcast pull, Odds API call, commit) the instant web/strikeouts.json
    # already shows today's date, so extra attempts that land after the
    # first success cost nothing.
    - cron: "47 12 * * *"
    - cron: "17 13 * * *"
    - cron: "47 13 * * *"
    - cron: "17 14 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      all_day:
        description: "Include games before 5pm ET too"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strikeout-board
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY=$(TZ=America/New_York date +%F)
            CURRENT=$(python3 -c "import json; print(json.load(open('web/strikeouts.json')).get('date',''))" 2>/dev/null || echo "")
            if [ "$CURRENT" = "$TODAY" ]; then
              echo "Already have $TODAY committed (an earlier scheduled attempt today succeeded) -- skipping this retry."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pybaseball cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -q -r requirements.txt

      - name: Grade yesterday's strikeout picks
        if: steps.gate.outputs.run == 'true'
        run: python -m pipeline.grade_strikeouts || echo "grading failed; continuing"

      - name: Project strikeouts
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          python -m pipeline.run_strikeouts --output web/strikeouts.json \
            ${{ inputs.all_day && '--all-day' || '' }}

      - name: Commit strikeout board
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/strikeouts.json history/strikeouts results/strikeout_log.csv results/strikeouts
          git diff --cached --quiet || git commit -m "strikeouts: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: project
    if: needs.project.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Shared with the HR and gamelines boards' deploy jobs (same group name)
    # so GitHub Pages' single-deployment-at-a-time limit queues concurrent
    # deploys instead of racing them into a silently-swallowed 400.
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
