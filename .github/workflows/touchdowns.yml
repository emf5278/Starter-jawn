name: NFL anytime-TD board

# An NFL slate is a calendar day, so unlike the MLB boards this one has
# nothing to do most days of the week. The "Decide whether to run" gate
# checks the published schedule *before* installing anything or touching
# The Odds API, and exits in a couple of seconds on a Tuesday.
#
# Sunday runs TWICE, because it is really two slates:
#   9:30am ET -> the early window, the 1pm games only
#   3:00pm ET -> the late window, 4:05/4:25 plus Sunday night
# Each board shows only games that have not kicked off yet, and the late run
# picks up the inactives and line moves that happen while the early games
# are being played. Thursday and Monday have a single night game, so their
# window resolves to "all" and one run covers it.
#
# Odds API credits: player props cost one request per event, and the fetch is
# narrowed to the window being published, so each game is priced exactly once
# per week -- splitting Sunday costs no more than a single run over the whole
# slate. Still roughly 16 prop requests a week plus one game-lines request
# per run.
on:
  schedule:
    # 9:30am ET = 13:30 UTC and 3:00pm ET = 19:00 UTC (EDT, UTC-4). Extra
    # attempts behind each because GitHub drops or delays this repo's crons;
    # the gate skips any attempt whose window is already published, so only
    # the first one that lands in each window does real work.
    - cron: "30 13 * * *"
    - cron: "50 13 * * *"
    - cron: "10 14 * * *"
    - cron: "0 19 * * *"
    - cron: "20 19 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Slate window to publish"
        type: choice
        default: auto
        options: [auto, early, late, all]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: touchdown-board
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run: ${{ steps.gate.outputs.run }}
      window: ${{ steps.gate.outputs.window }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          # How many games today, and which window is due right now? The
          # schedule is a single small CSV, so this costs one download and no
          # API credits. The window resolved here is passed straight to the
          # pipeline, so the gate and the board can never disagree about
          # which slate is being published.
          read -r HAS_GAMES WINDOW <<< "$(python3 .github/scripts/nfl_games_today.py "$TODAY")"
          REQUESTED="${{ inputs.window }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "auto" ]; then
            WINDOW="$REQUESTED"
          fi
          echo "games today ($TODAY): $HAS_GAMES | window: $WINDOW"
          echo "window=$WINDOW" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HAS_GAMES" = "0" ]; then
            echo "No NFL games today -- skipping (no Odds API call made)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Skip only when this exact slate is already published: a Sunday
            # publishes an early board and a late one, and the 3pm run must
            # not be waved off just because the 9:30am board carries today's
            # date. A checked-in demo board never satisfies the check either,
            # or the season's first real slate would be skipped as done.
            CURRENT=$(python3 -c "import json; d=json.load(open('web/touchdowns.json')); print('' if d.get('demo') else d.get('date','')+' '+d.get('window','all'))" 2>/dev/null || echo "")
            if [ "$CURRENT" = "$TODAY $WINDOW" ]; then
              echo "Already have $TODAY [$WINDOW] committed -- skipping this retry."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      # nflverse play-by-play is ~19MB gzipped per season and the model reads
      # two seasons, so caching it keeps a normal run to a few seconds of
      # network instead of 40MB every time.
      - name: Restore nflverse cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data_cache/nfl
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -q -r requirements.txt

      # Play-by-play for a slate is published a day or two later, so this
      # grades whatever is now available rather than strictly yesterday.
      - name: Grade recent touchdown picks
        if: steps.gate.outputs.run == 'true'
        run: |
          for d in 1 2 3; do
            python -m pipeline.grade_touchdowns \
              --date "$(TZ=America/New_York date -d "-$d day" +%F)" || true
          done

      - name: Project anytime touchdowns
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          python -m pipeline.run_touchdowns --output web/touchdowns.json \
            --window "${{ steps.gate.outputs.window }}"

      - name: Commit touchdown board
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the board itself is guaranteed to exist on a first run --
          # the history/ and results/ paths appear once there is something to
          # archive or grade, and `git add` on a missing pathspec is fatal.
          git add web/touchdowns.json
          for p in history/touchdowns results/touchdown_log.csv results/touchdowns; do
            [ -e "$p" ] && git add "$p"
          done
          true
          git diff --cached --quiet || git commit -m "touchdowns: $(date -u +%F) [${{ steps.gate.outputs.window }}]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: project
    if: needs.project.outputs.run == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # Shared with the MLB boards' deploy jobs (same group name) so Pages'
    # single-deployment-at-a-time limit queues them instead of racing.
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
