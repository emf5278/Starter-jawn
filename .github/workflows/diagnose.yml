name: Diagnose player

# Temporary, manual-only diagnostic. Prints why a player ranks where they do.
# Does not commit or deploy anything.
on:
  workflow_dispatch:
    inputs:
      player:
        description: "Player name substring"
        required: true
        default: "Caminero"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-
      - run: python -m pip install -q -r requirements.txt
      - run: python -m scripts.diagnose_player "${{ inputs.player }}"
