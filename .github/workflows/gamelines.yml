name: Moneyline + totals board

# Manual for now, same as the strikeout board. One cheap odds request
# (h2h+totals for the whole slate). Does not touch the HR or strikeout data.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gamelines-board
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pybaseball cache
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-

      - name: Build game lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          python -m pip install -q -r requirements.txt
          python -m pipeline.run_gamelines --output web/gamelines.json

      - name: Commit game lines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/gamelines.json history/gamelines
          git diff --cached --quiet || git commit -m "gamelines: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: project
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
