name: Probe available sportsbooks (diagnostic)

# Read-only diagnostic. Prints which bookmakers our Odds API plan returns per
# market and region, plus quota headers. Commits nothing, deploys nothing,
# and touches no pipeline state. Manual dispatch only; delete once answered.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q requests
      - name: Probe
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/probe_books.py
