name: Preview refresh (non-destructive)

# Runs the HR + strikeout pipelines and writes the results to preview/ ONLY.
#
# This exists to answer "what would the board look like if we refreshed right
# now?" without disturbing the published boards. Deliberately:
#   * writes to preview/*.json, never web/*.json
#   * commits ONLY the preview/ directory, so the history/<date>.json and
#     results/ files the pipelines touch on the runner are left uncommitted
#     and discarded when the runner is torn down -- the results log and the
#     archived slate that tomorrow's grading reads stay exactly as the
#     morning run left them
#   * uploads no Pages artifact and has no deploy job, so the live site is
#     untouched
#   * is manual-dispatch only (never scheduled)
#
# preview/ is not referenced by any page and does not match any workflow's
# push-path filter, so committing it triggers nothing.
on:
  workflow_dispatch:
    inputs:
      boards:
        description: "Which boards to preview"
        type: choice
        options: ["both", "hr", "strikeouts"]
        default: "both"
      all_day:
        description: "Strikeouts: include games before 5pm ET too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: preview-refresh
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore pybaseball cache
        uses: actions/cache@v4
        with:
          path: ~/.pybaseball
          key: pybaseball-${{ github.run_id }}
          restore-keys: pybaseball-

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Preview HR board
        if: inputs.boards == 'both' || inputs.boards == 'hr'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          mkdir -p preview
          python -m pipeline.run --output preview/predictions.json

      - name: Preview strikeout board
        if: inputs.boards == 'both' || inputs.boards == 'strikeouts'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: us
        run: |
          mkdir -p preview
          python -m pipeline.run_strikeouts --output preview/strikeouts.json \
            ${{ inputs.all_day && '--all-day' || '' }}

      - name: Commit preview only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Deliberately narrow: ONLY preview/. Any changes the pipelines made
          # to web/, history/ or results/ on this runner stay uncommitted.
          git add preview
          git diff --cached --quiet || git commit -m "preview: $(date -u +%FT%H%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Confirm live files untouched
        run: |
          echo "Working-tree changes NOT committed (should list web/ history/ results/ if the pipelines rewrote them):"
          git status --porcelain
          echo
          echo "Committed web/predictions.json date (must still be the morning run):"
          git show "origin/${GITHUB_REF_NAME}:web/predictions.json" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('generated_at'))"
          git show "origin/${GITHUB_REF_NAME}:web/strikeouts.json" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('generated_at'))"
